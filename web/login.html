<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>登录 - 设备设置</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/app.css?v=0.6.0-desktop1">
</head>
<body data-page="login">
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="login-heading">
      <div class="login-header">
        <div class="login-title-group">
          <h1 id="login-heading">
            <svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="6" width="18" height="12" rx="2"></rect>
              <line x1="7" y1="12" x2="7.01" y2="12"></line>
              <line x1="11" y1="12" x2="11.01" y2="12"></line>
              <path d="M16 10v4"></path>
            </svg>
            <span data-i18n="login.title">SP970 设备管理</span>
          </h1>
        </div>
        <div class="lang-switch" role="group" data-i18n-aria="common.langSwitch">
          <button type="button" data-lang="zh" class="active">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>

      <form id="login-form" novalidate>
        <div class="form-field">
          <label class="form-label" for="account" data-i18n="login.account">账号</label>
          <input class="input" id="account" name="account" value="admin" autocomplete="username" required>
        </div>

        <div class="form-field">
          <label class="form-label" for="password" data-i18n="login.password">密码</label>
          <div class="input-group">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            <button id="show-password" class="input-toggle" type="button" data-i18n="common.show" data-i18n-aria="login.showPassword">显示</button>
          </div>
        </div>

        <div id="login-error" class="alert error" role="alert" hidden>
          <div class="alert-body">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="login-error-text"></span>
          </div>
        </div>

        <button id="login-submit" class="btn btn-primary login-submit" type="submit" data-i18n="login.submit">登录</button>
      </form>
    </section>
  </main>
  <script src="/app.js?v=0.6.0-sms-delete3"></script>
</body>
</html>
