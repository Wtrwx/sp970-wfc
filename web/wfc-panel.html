<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>SP970 Wi-Fi Calling</title>
<style>
:root{font:16px/1.6 system-ui,-apple-system,sans-serif;color:#182c35;background:#f2f5f5}*{box-sizing:border-box}body{max-width:980px;margin:auto;padding:26px 20px 50px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}h1{font-size:25px;letter-spacing:-.5px;margin:0}h2{font-size:18px;margin:0 0 16px}p{margin:8px 0}small,.muted{color:#61727b}a{color:#176e65}section{background:white;border:1px solid #dce4e6;border-radius:14px;padding:24px;margin:16px 0}.row{display:flex;gap:16px;flex-wrap:wrap}.metric{flex:1;min-width:160px;padding:14px 18px;background:#f4f8f7;border-radius:8px}.metric strong{display:block;font-size:26px}.metric span{color:#61727b;font-size:14px}label{display:block;margin:14px 0 5px;font-weight:550}input:not([type=checkbox]),textarea{width:100%;padding:11px 12px;font:inherit;border:1px solid #bdcdd0;border-radius:7px;background:#fff}textarea{min-height:105px}button{font:inherit;padding:10px 17px;border:0;border-radius:7px;background:#176e65;color:#fff;cursor:pointer;margin:16px 8px 0 0}button.secondary{color:#176e65;background:#e8f1ef}button:disabled{opacity:.5;cursor:wait}.status{display:inline-block;padding:4px 12px;border-radius:20px;background:#edf1f2;color:#53656d}.status.ok{background:#daf1e8;color:#176044}.error{color:#a03131}#notice{min-height:26px}form{max-width:700px}footer{font-size:13px;padding-top:12px}code{font-size:13px;background:#edf1f2;padding:2px 5px;border-radius:3px}[hidden]{display:none!important}@media(max-width:600px){body{padding:18px 12px}section{padding:18px}header{align-items:flex-start;flex-direction:column}.metric{min-width:120px}}
</style>
<body>
<header><div><h1>SP970 Wi-Fi Calling</h1><small>原生 Android · Lebara UK · 短信收发与转发</small></div><a href="/sms-device.html">查看短信收件箱 ↗</a></header>
<section><span id="connection" class="status">正在连接…</span><p id="service-state" class="muted"></p><p id="notice" role="status" aria-live="polite"></p></section>
<section id="login-section"><h2>登录</h2><p class="muted">使用棒子原生管理后台的账号和密码。</p><form id="login-form"><label for="account">账号</label><input id="account" autocomplete="username" value="admin" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button id="login-button">登录</button></form></section>
<div id="workspace" hidden>
<section><h2>WFC 状态</h2><div class="row"><div class="metric"><strong id="sim">—</strong><span>SIM 策略前缀</span></div><div class="metric"><strong id="received">—</strong><span>本轮收到</span></div><div class="metric"><strong id="sent">—</strong><span>本轮已提交</span></div></div><p id="registration-detail" class="muted"></p><button id="refresh" class="secondary">刷新状态</button><button id="logout" class="secondary">退出登录</button></section>
<section><h2>发送短信</h2><form id="send-form"><label for="recipient">收件号码</label><input id="recipient" type="tel" placeholder="+44…" autocomplete="off" required><label for="message">短信内容</label><textarea id="message" maxlength="1000" required></textarea><button id="send-button">发送短信</button></form><small>只会在你点击发送后提交。运营商可能按套餐计费。</small></section>
<section id="forward"><h2>短信转发</h2><div id="forward-editor"></div></section>
</div>
<footer><a href="https://github.com/Wtrwx/sp970-wfc" target="_blank" rel="noopener">源码与使用说明</a> · AGPL-3.0 · 本面板复用原生账号，不含公共节点或公共转发凭据。</footer>
<script src="/forward-editor.js"></script>
<script src="/wfc-panel.js"></script>
</body></html>
